[package]
name = "disassembler"
version = "0.1.0"
edition = "2021"

[lib]
name = "disassembler"

[dependencies]
goblin = "0.8"
iced-x86 = "1.21"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
env_logger = "0.11"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"
capstone = "0.12"
